services:
  code-server:
    build: .
    container_name: ivscode-backend
    restart: unless-stopped
    environment:
      - PASSWORD=${CODE_SERVER_PASSWORD}
      - SHELL=/bin/bash
    ports:
      # SOLO localhost: nada expuesto a la red. Tailscale serve hace de proxy HTTPS.
      - "127.0.0.1:8443:8080"
    volumes:
      - ./workspace:/home/coder/workspace
      - code-local:/home/coder/.local      # extensiones, settings, kernels de jupyter
      - julia-depot:/home/coder/.julia     # artefactos de CUDA.jl persisten entre recreates
      - ~/.ssh:/home/coder/.ssh:ro         # tus llaves SSH, solo lectura
      # Si usas llaves con passphrase y ssh-agent en el host, descomenta:
      # - ${SSH_AUTH_SOCK}:/ssh-agent
    # environment adicional para el agente (descomenta junto con el volumen):
    #   - SSH_AUTH_SOCK=/ssh-agent
    shm_size: "16gb"                       # DataLoaders de PyTorch con num_workers > 0
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  code-local:
  julia-depot:
