# Boson Server: los instaladores de Mac y Linux, en un borrador de versión de
# GitHub. Se dispara al subir una etiqueta v1.2.3 (o a mano) y deja el DMG, el
# .deb y el AppImage adjuntos a un borrador para revisarlo y publicarlo.
#
# El DMG sale firmado y notarizado SOLO si existen los secretos de Apple
# (APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
# APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID); sin ellos sale sin firmar y macOS
# pedirá «abrir de todos modos» la primera vez. Ver boson-server/README.md.
name: Boson Server

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  instaladores:
    strategy:
      fail-fast: false
      matrix:
        include:
          - plataforma: ubuntu-22.04
            args: ""
          - plataforma: macos-latest
            args: "--target universal-apple-darwin"
    runs-on: ${{ matrix.plataforma }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: boson-server/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.plataforma == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Dependencias de Linux (webkit2gtk, appindicator)
        if: matrix.plataforma == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Paquetes de la interfaz
        working-directory: boson-server
        run: npm ci

      # Las credenciales de Apple solo se ponen si existen: una variable
      # vacía no es «sin firma» para Tauri, es un certificado que no puede
      # importar, y el job de Mac moría ahí.
      - name: Firma de Apple, si hay secretos
        if: matrix.plataforma == 'macos-latest'
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE }}
          CERT_PASS: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          IDENTIDAD: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          ID_APPLE: ${{ secrets.APPLE_ID }}
          PASS_APPLE: ${{ secrets.APPLE_PASSWORD }}
          EQUIPO: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$CERT" ] && [ -n "$IDENTIDAD" ]; then
            {
              echo "APPLE_CERTIFICATE=$CERT"
              echo "APPLE_CERTIFICATE_PASSWORD=$CERT_PASS"
              echo "APPLE_SIGNING_IDENTITY=$IDENTIDAD"
              echo "APPLE_ID=$ID_APPLE"
              echo "APPLE_PASSWORD=$PASS_APPLE"
              echo "APPLE_TEAM_ID=$EQUIPO"
            } >> "$GITHUB_ENV"
            echo "Con firma y notarización."
          else
            echo "Sin secretos de Apple: el DMG saldrá sin firmar."
          fi

      - name: Compilar y adjuntar al borrador de la versión
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: boson-server
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: "Boson Server v__VERSION__"
          releaseBody: "Instaladores de Boson Server: DMG para Mac, .deb y AppImage para Linux."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
