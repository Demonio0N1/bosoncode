name: iVsCode
options:
  bundleIdPrefix: com.garyguaman
  deploymentTarget:
    iOS: "17.0"

packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    from: 1.2.0

targets:
  iVsCode:
    type: application
    platform: iOS
    sources:
      - path: iVsCode
        excludes:
          - Fonts
      - path: iVsCode/Fonts
        buildPhase: resources
    dependencies:
      - package: SwiftTerm
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "2"            # solo iPad
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: iVsCode/Info.plist
        CODE_SIGN_ENTITLEMENTS: iVsCode/BosonCode.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.garyguaman.ivscode
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: QJ2824WK6Q

  iFinder:
    type: application
    platform: iOS
    sources:
      - path: iFinder
      # comparte el cliente del gestor, el almacén de servidores y el Llavero
      - path: iVsCode/Server.swift
      - path: iVsCode/DockerMachines.swift
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "2"
        SWIFT_VERSION: "5.9"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: iFinder/Info.plist
        CODE_SIGN_ENTITLEMENTS: iFinder/ZeroSpin.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: com.garyguaman.ifinder
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: QJ2824WK6Q
